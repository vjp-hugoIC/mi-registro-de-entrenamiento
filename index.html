<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mi recetario</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1 id="titulo">Mi recetario</h1>
    <p id="resumen"></p>
  </header>
  <section class="controles">
    <input id="buscador" type="search" placeholder="Buscar...">
    <button id="ordenNombre">Ordenar A-Z</button>
    <button id="ordenTiempo">Ordenar por ...</button>
    <button id="ordenFecha">Mas recientes primero</button>
  </section>

  <form id="añadir">
    <h3>Añadir nuevo entrenamiento</h3>
    <input id="tipo" placeholder="Tipo entrenamiento" required>
    <input id="fecha" placeholder="Fecha (AAAA-MM-DD)" required>
    <input id="duracion" type="number" placeholder="Duración (min)" required>
    <input id="distancia" type="number" placeholder="Distancia (m)" required>
    <input id="pulsaciones" type="number" placeholder="Pulsaciones" required>
    <button type="submit">Añadir</button>
  </form>

  <p id="estadisticas"></p>
  <main id="listado">
    
  </main>
  <script src="js/app.js" defer></script>
</body>

</html>
